<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Live2D Preview</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1e1e1e; }
  #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
             color: #aaa; font-family: sans-serif; font-size: 14px; }
</style>
</head>
<body>
<div id="loading">Loading…</div>
<script src="pixi.min.js"></script>
<script src="live2d.min.js"></script>
<script src="live2dcubismcore.min.js"></script>
<script src="pixi-live2d-display.min.js"></script>
<script>
  const MODEL_FILE = "__MODEL3__";
  window.__state = "init";

  let app = null;
  let model = null;
  let baseW = 1;
  let baseH = 1; // 模型原始逻辑尺寸（加载时锁定，不受 scale 影响）
  let zoom = 1; // 滚轮缩放系数（相对最佳适配）
  let fitRaf = 0;

  try {
    app = new PIXI.Application({
      autoStart: true,
      resizeTo: window,
      antialias: true,
      backgroundAlpha: 0,
      resolution: window.devicePixelRatio || 1,
    });
    window.__state = "pixi-ok";
    document.body.appendChild(app.view);
    document.getElementById("loading").style.display = "none";
  } catch (e) {
    window.__state = "pixi-fail: " + e.message;
    document.getElementById("loading").textContent = "PIXI failed: " + e.message;
  }

  // 适配：基于锁定的基准尺寸，窗口变化/缩放不会震荡
  function fit() {
    if (!model) return;
    const s = Math.min(app.screen.width / baseW, app.screen.height / baseH) * zoom;
    model.scale.set(s);
    model.position.set((app.screen.width - baseW * s) / 2, (app.screen.height - baseH * s) / 2);
  }

  // resize 防抖：一帧内多次 resize 只适配一次
  function fitSoon() {
    if (fitRaf) cancelAnimationFrame(fitRaf);
    fitRaf = requestAnimationFrame(fit);
  }

  if (app) {
    // 滚轮缩放（围绕画面中心，0.2x ~ 6x）
    app.view.addEventListener(
      "wheel",
      (e) => {
        e.preventDefault();
        zoom = Math.max(0.2, Math.min(6, zoom * (e.deltaY < 0 ? 1.12 : 1 / 1.12)));
        fit();
      },
      { passive: false }
    );

    PIXI.live2d.Live2DModel.from(MODEL_FILE, { autoInteract: true })
      .then((m) => {
        model = m;
        window.__state = "model-ok";
        window.__model = m; // 供外部诊断 / Qt 侧查询
        baseW = m.width;
        baseH = m.height; // 首次 scale=1，此刻尺寸即模型原始逻辑尺寸
        app.stage.addChild(m);
        fit();
        window.addEventListener("resize", fitSoon);
        setTimeout(autoPlay, 300);
      })
      .catch((err) => {
        window.__state = "model-fail: " + err.message;
        document.getElementById("loading").textContent = "Failed: " + err.message;
      });
  }

  // 供 Qt 侧调用（动作组 / 表达式）
  window.playMotion = function (group, index) {
    if (model) model.motion(group || "idle", index || 0);
  };
  window.availableGroups = function () {
    if (!model) return [];
    return Object.keys(model.internalModel.motions || {});
  };

  // 模型就绪后自动播放：优先 idle，否则第一个动作
  function autoPlay() {
    const groups = window.availableGroups();
    const fav = groups.includes("idle") ? "idle" : groups[0];
    if (fav) {
      try {
        window.playMotion(fav);
        window.__state = "model-ok";
      } catch (e) {
        /* 无动作也保持 model-ok */
      }
    }
  }
</script>
</body>
</html>
