[project]
name = "alth"
version = "1.8.9"
description = "Azur Lane Tachie Helper"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "cython",
    "numpy",
    "pillow",
    "pyqtdarktheme",
    "pyside6",
    "pytoshop",
    "rich",
    "setuptools",
    "six",
    "unitypy",
]

[project.optional-dependencies]
build = ["nuitka<2.6", "numpy<2.3"]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
